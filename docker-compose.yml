services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: skillbite
      POSTGRES_PASSWORD: skillbite
      POSTGRES_DB: skillbite
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillbite -d skillbite"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: "3000"
      LOG_LEVEL: info
      DATABASE_URL: postgresql://skillbite:skillbite@database:5432/skillbite
      TOKEN_SIGNING_SECRET: replace-with-a-long-random-secret
      ACCESS_TOKEN_TTL_SECONDS: "900"
      REFRESH_TOKEN_TTL_SECONDS: "1209600"
      SESSION_TTL_SECONDS: "1209600"
      AUTH_TOKEN_TTL_SECONDS: "3600"
      ARGON2_MEMORY_COST: "19456"
      ARGON2_TIME_COST: "2"
      ARGON2_PARALLELISM: "1"
      GOOGLE_CLIENT_ID: ""
      MEDIA_ROOT: /app/var/media
      PUSH_TOKEN_KEY: replace-with-a-long-random-secret
    volumes:
      - media:/app/var
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:3000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3002:3001"

volumes:
  pgdata:
  media:
